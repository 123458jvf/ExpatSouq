<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e4b"><title>Browse Classifieds | ExpatSouq</title><meta name="description" content="Browse approved ExpatSouq classifieds by category and location."><style>
:root{--green:#08634e;--deep:#073d31;--gold:#efa844;--ink:#17251f;--muted:#64746b;--line:#dce6df;--paper:#f6f8f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}.top{background:var(--deep);color:#e3f2e9;padding:8px 0;font-size:12px}.nav{background:#fff;border-bottom:1px solid var(--line)}.navin{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:24px;color:var(--green)}.logo b{color:var(--gold)}.btn{display:inline-block;background:var(--green);color:white;border-radius:8px;padding:10px 14px;font-weight:700;border:0}.hero{background:linear-gradient(120deg,#e9f4ec,#f9fbf8);padding:28px 0;border-bottom:1px solid var(--line)}h1{font-size:clamp(27px,4vw,40px);margin:0 0 6px;line-height:1.15}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-top:16px}.filters input,.filters select{padding:12px;border:1px solid var(--line);border-radius:8px;background:white;min-width:0}.section{padding:24px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.visual{height:145px;background:linear-gradient(130deg,#e4f1e7,#f8f7ec);display:grid;place-items:center;font-size:48px}.visual img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.body h3{font-size:16px;margin:0 0 7px;overflow-wrap:anywhere}.price{color:var(--green);font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:5px}.tag{font-size:10px;font-weight:800;color:#8a5b15;background:#fff0d9;padding:4px 7px;border-radius:5px;display:inline-block;margin-bottom:7px}.empty{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;color:var(--muted)}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.cats a{background:white;border:1px solid var(--line);border-radius:30px;padding:7px 11px;font-size:12px;color:var(--green)}footer{background:#062f25;color:#d9e9df;padding:22px 0;margin-top:15px;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr}.visual{height:100px}.body{padding:10px}.body h3{font-size:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.visual{height:150px}.navin{flex-wrap:wrap;padding:9px 0}.btn{padding:9px 10px;font-size:12px}}
</style></head><body><div class="top"><div class="wrap">Your trusted expatriate community marketplace · Saudi Arabia and worldwide</div></div><header class="nav"><div class="wrap navin"><a class="logo" href="/">⌂ Expat<b>Souq</b></a><div><a class="btn" href="/">Home</a> <a class="btn" href="/#postBtn">＋ Post Ad</a></div></div></header><section class="hero"><div class="wrap"><h1 id="pageTitle">Browse Classifieds</h1><p class="muted" id="pageDesc">Explore approved listings by category.</p><form id="filters" class="filters"><input id="q" placeholder="Search listings..." aria-label="Search listings"><select id="country"><option value="">All countries</option></select><button class="btn" type="submit">Search</button></form><div class="cats" id="categoryLinks"></div></div></section><main class="wrap section"><div class="head"><h2 id="listTitle">Latest approved ads</h2><span class="muted" id="count"></span></div><div id="results" class="grid"><div class="empty">Loading approved listings…</div></div></main><footer><div class="wrap">© 2026 ExpatSouq · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></div></footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCyKrdW6BLIK-aSLsN04lEpe_8X7ZTxYyo",authDomain:"expatsouq-7f964.firebaseapp.com",projectId:"expatsouq-7f964",storageBucket:"expatsouq-7f964.firebasestorage.app",messagingSenderId:"421619491074",appId:"1:421619491074:web:9fde0b86a477ec4719621b",measurementId:"G-WJ461RJPGT"};
const db=getFirestore(initializeApp(firebaseConfig));
const categories=[
["Jobs","Job Seekers","Temp Jobs"],["Items For Sale","Air Conditioners","Appliances","Auto Parts","Baby & Kid Stuff","Bicycles","Boats","Books","Clothing & Accessories","Collectibles","Computers","Electronics","Furniture","Mobile Phones","Vehicles, Cars & Trucks"],["Items Wanted"],["Learning","Language Exchange","Lessons Offered","Lessons Wanted"],["Housing","Apartments, Flats, Houses & Villas","Bedspace For Rent","Holiday/Vacation Rentals","Rooms for Rent","Real Estate For Sale","Villas"],["Commercial Property","Buildings","Factories","Offices","Shops","Warehouses"],["Plots","Agricultural Land","Commercial Plots","Industrial Land","Residential Plots"],["Housing Wanted","Apts/Flats Wanted","Bedspace Wanted","Roommates"],["Childcare","Childcare Jobs","Daycare"],["Community","Artists","Events","General","Help","Lost & Found","Pet Adoption","Rideshare"],["Business (B2B)","Business Partners","Businesses For Sale","Wholesale Products"],["Services","Accounting","Air Conditioning","Appliance Repair","Automotive","Cleaning","Computer","Creative","Delivery","Education","Graphic Design","Printing","Real Estate","Translation","Web Design & Development"],["Matrimonials","Seeking Bride","Seeking Groom"]];
const slug=s=>String(s||"").toLowerCase().trim().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const params=new URLSearchParams(location.search),wanted=(params.get("category")||"").replace(/-/g," ").toLowerCase(),title=params.get("category")?categories.flat().find(x=>x.toLowerCase()===wanted)||wanted.replace(/\b\w/g,c=>c.toUpperCase()):"All Categories";
document.title=title+" | ExpatSouq";document.getElementById("pageTitle").textContent=title;document.getElementById("listTitle").textContent=title==="All Categories"?"Latest approved ads":title+" classifieds";
document.getElementById("categoryLinks").innerHTML=categories.map(c=>'<a href="/category.html?category='+encodeURIComponent(slug(c[0]))+'">'+c[0]+'</a>').join("");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
let ads=[];
try{
 const snap=await getDocs(query(collection(db,"ads"),where("status","==","approved")));
 ads=snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>String(a.status||"").toLowerCase()==="approved");
 const countries=[...new Set(ads.map(a=>a.country).filter(Boolean))].sort();document.getElementById("country").innerHTML='<option value="">All countries</option>'+countries.map(c=>'<option>'+esc(c)+'</option>').join("");
}catch(e){document.getElementById("results").innerHTML='<div class="empty">Listings could not load right now. Please refresh the page.</div>';console.error(e)}
function key(a){return a.id||slug(a.title)}
function render(){
 const q=norm(document.getElementById("q").value),country=document.getElementById("country").value;
 const chosen=norm(title);
 const filtered=ads.filter(a=>{
  const cat=norm(a.category),sub=norm(a.sub),catMatch=title==="All Categories"||cat===chosen||sub===chosen||categories.some(c=>norm(c[0])===chosen&&[norm(a.category),norm(a.sub)].includes(norm(c[0])));
  const text=norm([a.title,a.category,a.sub,a.city,a.area,a.country,a.desc,a.description].join(" "));
  return catMatch&&(!q||text.includes(q))&&(!country||a.country===country);
 }).sort((a,b)=>(b.sponsored===true)-(a.sponsored===true)||(b.pinned===true)-(a.pinned===true));
 document.getElementById("count").textContent=filtered.length+" ads";
 document.getElementById("results").innerHTML=filtered.length?filtered.map(a=>'<a class="card" href="/details.html?id='+encodeURIComponent(key(a))+'"><div class="visual">'+(a.imageUrl?'<img src="'+esc(a.imageUrl)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':esc(a.icon||"📌"))+'</div><div class="body"><span class="tag">'+esc(a.sub||a.category||"Classified")+'</span><h3>'+esc(a.title||"Classified listing")+'</h3><div class="price">'+(a.price?esc(a.currency||"SAR")+" "+esc(a.price):"Contact for price")+'</div><div class="meta">📍 '+esc([a.city,a.area,a.country].filter(Boolean).join(", ")||"Location not specified")+'</div></div></a>').join(""):'<div class="empty">No approved ads found in this category yet. Try another category or search term.</div>';
}
document.getElementById("filters").addEventListener("submit",e=>{e.preventDefault();render()});document.getElementById("country").addEventListener("change",render);render();
</script></body></html>
