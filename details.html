<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e4b"><title>Ad Details | ExpatSouq</title><meta name="description" content="View classified listing details on ExpatSouq."><style>
:root{--green:#08634e;--deep:#073d31;--gold:#efa844;--ink:#17251f;--muted:#64746b;--line:#dce6df;--paper:#f6f8f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(850px,calc(100% - 24px));margin:auto}.top{background:var(--deep);color:#e3f2e9;padding:8px 0;font-size:12px}.nav{background:#fff;border-bottom:1px solid var(--line)}.navin{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:900;font-size:24px;color:var(--green)}.logo b{color:var(--gold)}.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.main{padding:22px 0 40px}.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(16px,4vw,30px)}h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:0 0 10px;overflow-wrap:anywhere}.tag{display:inline-block;background:#fff0d9;color:#8a5b15;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:800;margin-bottom:10px}.price{font-size:23px;font-weight:800;color:var(--green);margin:12px 0}.meta{color:var(--muted);font-size:13px;margin:6px 0}.photo{width:100%;max-height:480px;object-fit:contain;background:var(--paper);border-radius:9px;margin:12px 0}.description{white-space:pre-wrap;overflow-wrap:anywhere;margin:18px 0}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.fact{font-size:13px;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions a,.actions button{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;background:#fff;cursor:pointer}.actions .primary{background:var(--green);border-color:var(--green);color:#fff}.state{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;color:var(--muted)}footer{padding:20px 0;background:var(--deep);color:#d9e9df;font-size:12px}@media(max-width:500px){.facts{grid-template-columns:1fr}.navin{min-height:58px}.logo{font-size:21px}.btn{font-size:12px;padding:9px 10px}}
</style></head><body><div class="top"><div class="wrap">Your trusted expatriate community marketplace · Saudi Arabia and worldwide</div></div><header class="nav"><div class="wrap navin"><a class="logo" href="/">⌂ Expat<b>Souq</b></a><a class="btn" href="/category.html">Browse Ads</a></div></header><main class="wrap main"><div class="crumb"><a href="/">Home</a> / <span id="crumbCategory">Ad Details</span></div><div id="content" class="state">Loading listing details…</div></main><footer><div class="wrap">© 2026 ExpatSouq · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></div></footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCyKrdW6BLIK-aSLsN04lEpe_8X7ZTxYyo",authDomain:"expatsouq-7f964.firebaseapp.com",projectId:"expatsouq-7f964",storageBucket:"expatsouq-7f964.firebasestorage.app",messagingSenderId:"421619491074",appId:"1:421619491074:web:9fde0b86a477ec4719621b",measurementId:"G-WJ461RJPGT"};
const db=getFirestore(initializeApp(firebaseConfig));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),id=params.get("id")||"";
const root=document.getElementById("content");
const slug=v=>String(v||"").toLowerCase().trim().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
try{
 if(!id)throw new Error("missing");
 const snap=await getDoc(doc(db,"ads",id));
 if(!snap.exists())throw new Error("notfound");
 const ad={id:snap.id,...snap.data()};
 if(String(ad.status||"").toLowerCase()!=="approved")throw new Error("notfound");
 const title=String(ad.title||"Classified listing"),category=String(ad.sub||ad.category||"Classified"),place=[ad.city,ad.area,ad.country].filter(Boolean).join(", ")||"Location not specified",desc=String(ad.desc||ad.description||"No description provided."),phone=String(ad.phone||"").trim(),price=ad.price?String(ad.currency||"SAR")+" "+String(ad.price):"Contact for price";
 document.title=title+" | ExpatSouq";
 document.getElementById("crumbCategory").textContent=category;
 const digits=phone.replace(/\D/g,"");let wa=digits;if(String(ad.country||"").toLowerCase()==="saudi arabia"&&wa.startsWith("0"))wa="966"+wa.slice(1);
 root.className="panel";
 root.innerHTML='<span class="tag">'+esc(category)+'</span><h1>'+esc(title)+'</h1><div class="meta">📍 '+esc(place)+'</div><div class="price">'+esc(price)+'</div>'+(ad.imageUrl?'<img class="photo" src="'+esc(ad.imageUrl)+'" alt="'+esc(title)+'" onerror="this.style.display=\'none\'">':'')+'<h2>Ad Description</h2><div class="description">'+esc(desc)+'</div><div class="facts"><div class="fact"><b>Category</b><br>'+esc(category)+'</div><div class="fact"><b>Location</b><br>'+esc(place)+'</div><div class="fact"><b>Posted</b><br>'+esc(ad.createdAt?.toDate?.().toLocaleDateString?.()||"Recently")+'</div><div class="fact"><b>Price</b><br>'+esc(price)+'</div></div><div class="actions">'+(phone?'<a class="primary" href="tel:'+encodeURIComponent(phone)+'">Call Poster</a>':'')+(wa?'<a href="https://wa.me/'+encodeURIComponent(wa)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a>':'')+'<button id="share" type="button">Share Ad</button><a href="/category.html?category='+encodeURIComponent(slug(ad.category||""))+'">More Ads</a></div>';
 document.getElementById("share").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById("share").textContent="Link copied"}catch{prompt("Copy this ad link",location.href)}});
}catch(e){root.className="state";root.innerHTML='This ad could not be found, may have been removed, or is not approved yet.<p><a class="btn" href="/category.html">Browse approved ads</a></p>'}
</script></body></html>
